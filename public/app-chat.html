<template component="app-chat">
  <section class="flex flex-col bg-zinc-950 h-full">
    <header class="h-14 border-b border-zinc-800 flex items-center px-4 gap-3">
      <button class="md:hidden" aria-label="Back to sessions" on-click="$app.openSessions()">←</button>
      <div
        class="font-medium"
        bind-inner-text="$s.session?.title || ($ws.workspace ? 'New conversation' : 'Select a workspace')"
      ></div>
    </header>
    <template if="!$s.sessionId">
      <section class="flex-1 overflow-y-auto p-6 md:p-10">
        <div class="mx-auto max-w-3xl rounded-2xl border border-zinc-800 bg-zinc-900 p-6">
          <p class="text-xs font-semibold uppercase tracking-wide text-emerald-400">No conversation open</p>
          <h1
            class="mt-2 text-2xl font-semibold"
            bind-inner-text="$ws.workspace ? 'Choose what to work on' : 'Choose a workspace first'"
          ></h1>
          <p
            class="mt-4 text-zinc-300"
            bind-inner-text="$ws.workspace ? 'Start a planning session or open one of your existing conversations.' : 'Open Workspaces, choose a project, then start a planning session.'"
          ></p>
          <template if="$ws.workspace">
            <button
              class="mt-6 rounded-lg bg-emerald-700 px-4 py-2 text-sm font-medium"
              on-click="createPlannerSession()"
            >
              Start planning →
            </button>
            <button
              class="ml-3 mt-6 rounded-lg border border-zinc-700 px-4 py-2 text-sm font-medium"
              on-click="$app.openSessions()"
            >
              View sessions
            </button>
          </template>
          <template if="!$ws.workspace">
            <button
              class="mt-6 rounded-lg bg-emerald-700 px-4 py-2 text-sm font-medium text-white"
              on-click="$app.openSidebar()"
            >
              Choose a workspace →
            </button>
          </template>
        </div>
      </section>
    </template>
    <div class="flex-1 overflow-y-auto p-4 md:px-8 space-y-3" aria-live="polite" class-hidden="!$s.sessionId">
      <template for="m of $msg.messages"
        ><article
          class="max-w-3xl rounded-2xl px-4 py-3 text-sm"
          bind-class="m.role === 'user' ? 'ml-auto bg-emerald-950 text-emerald-50' : m.role === 'tool' ? 'mx-auto bg-zinc-900 text-zinc-400' : 'mr-auto bg-zinc-800 text-zinc-100'"
        >
          <template if="m.role === 'tool'"
            ><details>
              <summary class="cursor-pointer" bind-inner-text="m.tool_name || 'Tool result'"></summary>
              <collapsed-text bind-content="m.content || ''"></collapsed-text></details></template
          ><template if="m.role !== 'tool'"
            ><div class="whitespace-pre-wrap" bind-inner-text="m.content || ''"></div>
            <div class="mt-2 flex justify-end gap-3" class-hidden="m.role !== 'assistant'">
              <button type="button" aria-label="Read reply aloud" title="Read reply aloud" on-click="speak(m.content)">
                ▶</button
              ><button type="button" aria-label="Stop speaking" title="Stop speaking" on-click="stopSpeech()">■</button>
            </div></template
          >
        </article></template
      >
    </div>
    <div class="p-3 md:px-8 border-t border-zinc-800">
      <label class="flex items-center gap-2 text-xs text-zinc-400 mb-2"
        ><input type="checkbox" bind-checked="autoRead" on-change="setAutoRead($event.target.checked)" /> Read assistant
        replies aloud</label
      >
      <form
        class="max-w-3xl mx-auto rounded-2xl bg-zinc-900 border border-zinc-700 p-2 focus-within:border-emerald-600"
        on-submit.prevent="$msg.sendMessage()"
      >
        <textarea
          aria-label="Message draft"
          rows="2"
          placeholder="Write a message…"
          bind-value="$msg.newMessage"
          bind-disabled="$msg.sending"
          class="w-full bg-transparent resize-none p-2 focus:outline-none"
          on-input.stop="$msg.setNewMessage($event.target.value)"
          on-keydown="onKeyDown($event)"
        ></textarea>
        <div class="flex justify-between items-center px-2">
          <div class="flex gap-3">
            <select
              aria-label="Model"
              class="bg-zinc-800 rounded px-2 py-1 text-xs"
              bind-value="$msg.model"
              on-change="$msg.setModel($event.target.value)"
            >
              <option value="">Default model</option>
              <template for="m of modelListMapped"
                ><option bind-value="m.value" bind-inner-text="m.label"></option
              ></template></select
            ><button
              type="button"
              aria-label="Start voice dictation"
              title="Start voice dictation"
              on-click="toggleDictation()"
              bind-disabled="!speechAvailable"
            >
              🎙
            </button>
          </div>
          <button
            type="submit"
            aria-label="Send message"
            class="bg-emerald-700 rounded-lg px-4 py-2 focus-visible:outline focus-visible:outline-2"
            bind-disabled="$msg.sendDisabled"
          >
            Send
          </button>
        </div>
      </form>
      <p class="text-xs text-center text-zinc-500 mt-1" role="status" bind-inner-text="voiceStatus"></p>
    </div>
  </section>
  <script setup>
    import { computed, effect, ref } from "@li3/web";
    import { useWorkspaces } from "@app/store/workspaces.mjs";
    import { useSessions } from "@app/store/sessions.mjs";
    import { useMessages } from "@app/store/messages.mjs";
    import { useApp } from "@app/store/app.mjs";
    export default function () {
      const $ws = useWorkspaces(),
        $s = useSessions(),
        $msg = useMessages(),
        $app = useApp();
      const modelListMapped = computed(() =>
        ($msg.modelList || []).map((m) => ({ label: `${m.name} · ${m.serverName || m.provider}`, value: m.id })),
      );
      const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
      const speechAvailable = Boolean(Speech),
        voiceStatus = ref(""),
        autoRead = ref(localStorage.getItem("age-auto-read") === "true");
      let recognition,
        dictationBase = "";
      effect(
        () => $msg.messages.value,
        (items) => {
          const latest = items?.[items.length - 1];
          if (autoRead.value && latest?.role === "assistant" && latest.content && !latest.thinking)
            speak(latest.content);
        },
      );
      function toggleDictation() {
        if (recognition) {
          recognition.stop();
          recognition = null;
          voiceStatus.value = "Dictation stopped";
          return;
        }
        if (!Speech) {
          voiceStatus.value = "Voice dictation is not supported by this browser";
          return;
        }
        recognition = new Speech();
        recognition.interimResults = true;
        recognition.continuous = true;
        dictationBase = $msg.newMessage.value;
        recognition.onresult = (event) => {
          let finalText = "",
            interim = "";
          for (let i = event.resultIndex; i < event.results.length; i++) {
            if (event.results[i].isFinal) finalText += event.results[i][0].transcript;
            else interim += event.results[i][0].transcript;
          }
          $msg.setNewMessage([dictationBase, finalText, interim].filter(Boolean).join(" "));
        };
        recognition.onerror = (event) => {
          voiceStatus.value = `Dictation error: ${event.error}`;
          recognition = null;
        };
        recognition.onend = () => {
          recognition = null;
        };
        voiceStatus.value = "Listening…";
        recognition.start();
      }
      function speak(text) {
        if ("speechSynthesis" in window && text) {
          if (recognition) recognition.stop();
          window.speechSynthesis.cancel();
          window.speechSynthesis.speak(new SpeechSynthesisUtterance(text));
        }
      }
      function stopSpeech() {
        if ("speechSynthesis" in window) window.speechSynthesis.cancel();
      }
      function setAutoRead(value) {
        autoRead.value = value;
        localStorage.setItem("age-auto-read", String(value));
      }
      function onKeyDown(e) {
        if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) {
          e.preventDefault();
          $msg.sendMessage();
        }
      }
      async function createPlannerSession() {
        await $s.createSession({ role: "planner", title: "Planner" });
        $app.openChat();
      }
      return {
        $ws,
        $s,
        $msg,
        $app,
        modelListMapped,
        speechAvailable,
        voiceStatus,
        autoRead,
        toggleDictation,
        speak,
        stopSpeech,
        setAutoRead,
        onKeyDown,
        createPlannerSession,
      };
    }
  </script>
</template>
