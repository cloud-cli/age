<template component="chat-message">
  <script setup>
    import { defineProp } from '@li3/web';
    import { useMessages } from '@app/store.mjs';

    export default function () {
      const $msg = useMessages();
      async function onDeleteMessage() {
        const uid = m.meta?.uid;

        if (!uid || !confirm('Are you sure?')) {
          return;
        }

        await $msg.deleteMessage(uid);
      }

      const m = defineProp('message', { default: () => {} });

      return { m, onDeleteMessage };
    }
  </script>

  <div class="flex items-center justify-between text-xs mb-1">
    <div>
      <span class="inline-block rounded p-1 bg-zinc-700 empty:hidden" bind-inner-text="m.meta?.model || ''"></span>
    </div>

    <button class="text-red-400/70" class-hidden="m.meta?.thinking || !m.meta?.uid" on-click="onDeleteMessage()">
      <lucide-icon icon="trash-2" size="16" title="Delete message"></lucide-icon>
    </button>
  </div>

  <div
    class="relative space-y-2 overflow-auto"
    class-border-l.border-zinc-600.pl-4.py-2="m.role === 'assistant'"
    bind-msg="m"
  >
    <template if="m.thinking">
      <collapsed-text class="text-zinc-400 w-full block" bind-content="m.thinking || ''"></collapsed-text
    ></template>

    <template if="m.content">
      <markdown-it bind-src="m.content" class="bg-zinc-900 rounded-md text-white p-1 w-full block"></markdown-it>
    </template>

    <template if="message.role === 'tool'">
      <div class="text-emerald-500 px-1 py-0.5" bind-inner-text="m.tool_name || ''"></div>
      <collapsed-text class="text-zinc-500" bind-content="m.content || ''"></collapsed-text>
    </template>
  </div>
</template>

<template component="app-chat">
  <section class="flex flex-col bg-zinc-950 border-r border-zinc-800 h-full">
    <div class="flex-1 overflow-y-auto p-4 font-mono text-xs flex flex-col-reverse gap-2">
      <template for="m of $msg.messages">
        <chat-message bind-message="m"></chat-message>
      </template>
    </div>

    <div class="p-3 border-t border-zinc-800 bg-zinc-900/20" class-hidden="!$ws.workspace || !$sessions.sessionId">
      <form
        class="relative bg-zinc-900 border border-zinc-800 rounded-xl focus-within:border-zinc-700 transition p-2"
        on-submit.prevent="$msg.sendMessage()"
      >
        <textarea
          rows="2"
          name="prompt"
          placeholder="Next steps..."
          bind-value="$msg.newMessage"
          bind-disabled="$msg.sending"
          class="w-full bg-transparent text-sm placeholder-zinc-600 focus:outline-none resize-none px-2 py-1"
          class-text-zinc-200="!$msg.sending"
          class-text-zinc-600="$msg.sending"
          on-input.stop="$msg.setNewMessage($event.target.value)"
          on-keydown="onKeyDown($event)"
        ></textarea>
        <div class="flex justify-between items-center p-2 px-1">
          <dynamic-list
            label="Model"
            placeholder="Model to use"
            bind-list="modelListMapped"
            bind-selected="$msg.model"
            on-reload="$msg.reloadModelList()"
            on-select="$msg.setModel($event.detail)"
            on-add="onPullModel()"
          ></dynamic-list>

          <div class="flex items-center gap-3">
            <button
              type="submit"
              class="bg-zinc-100 text-black hover:bg-zinc-200 font-semibold text-xs px-3 py-1 rounded-md transition"
              class-animate-pulse="$msg.sending"
              class-opacity-50="$msg.sendDisabled"
              bind-disabled="$msg.sendDisabled"
            >
              <lucide-icon icon="send-horizontal" size="24" title="Send"></lucide-icon>
            </button>

            <button
              type="button"
              on-click="$msg.retryMessage()"
              class="text-xs text-zinc-600 font-mono"
              class-hidden="!$sessions.sessionId"
            >
              <lucide-icon icon="list-restart" size="24" title="Retry"></lucide-icon>
            </button>

            <button
              type="button"
              on-click="$msg.reloadMessages()"
              class="text-xs text-zinc-600 font-mono"
              class-hidden="!$sessions.sessionId"
            >
              <lucide-icon icon="refresh-cw" size="24" title="Reload"></lucide-icon>
            </button>
          </div>
        </div>
      </form>
    </div>
  </section>

  <script setup>
    import { computed } from '@li3/web';
    import { useWorkspaces, useSessions, useMessages } from '@app/store.mjs';

    export default function () {
      const $ws = useWorkspaces();
      const $sessions = useSessions();
      const $msg = useMessages();
      const modelListMapped = computed(() => ($.modelList || []).map((m) => ({ label: m.id, value: m.id })));

      function onKeyDown(e) {
        if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
          e.preventDefault();
          $msg.sendMessage();
        }
      }

      async function onPullModel() {
        const name = prompt('Model name', '');

        if (name) {
          await $msg.pullModel(name);
        }
      }

      return {
        $ws,
        $msg,
        $sessions,
        modelListMapped,
        onKeyDown,
        onPullModel,
      };
    }
  </script>
</template>
