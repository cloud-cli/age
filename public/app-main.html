<template component="app-main">
  <div class="bg-zinc-950 text-zinc-100 font-sans h-dvh flex">
    <template if="$p.profile">
      <aside
        class="w-72 shrink-0 border-r border-zinc-800 bg-zinc-900 flex flex-col max-md:w-full"
        class-hidden="$app.isCompact && $app.chatVisible"
      >
        <header class="p-4 border-b border-zinc-800 flex justify-between items-center">
          <strong>Workspaces</strong>
          <div class="flex items-center gap-2">
            <button aria-label="Create workspace" title="Create workspace" on-click="onCreateWorkspace()">＋</button>
            <button class="text-xs text-zinc-400 hover:text-zinc-100" on-click="signOut()">Sign out</button>
          </div>
        </header>
        <nav aria-label="Projects" class="p-2 border-b border-zinc-800 space-y-1">
          <div class="px-2 py-1 text-xs uppercase tracking-wide text-zinc-400">Projects</div>
          <template for="w of $ws.workspaceList">
            <button
              class="w-full rounded px-3 py-2 text-left text-sm hover:bg-zinc-800 focus-visible:outline focus-visible:outline-2"
              bind-class="{ 'bg-zinc-800 text-emerald-300': $ws.workspace === w.name }"
              bind-inner-text="w.name"
              on-click="$ws.setWorkspace(w.name)"
            ></button>
          </template>
          <p class="px-2 py-1 text-xs text-zinc-500" class-hidden="$ws.workspaceList.length">No projects yet</p>
        </nav>
        <section class="px-3 pt-3" class-hidden="!$ws.workspace">
          <button
            class="w-full rounded px-3 py-2 text-left text-sm hover:bg-zinc-800"
            on-click="$s.setSessionById(''); $app.chatVisible = false"
          >
            Project overview
          </button>
          <div class="mt-2 text-xs uppercase text-zinc-400">Project brief</div>
          <p class="py-2 text-xs text-zinc-400" bind-inner-text="$ws.project?.summary || 'No project summary yet.'"></p>
          <div
            class="text-xs text-zinc-400"
            bind-inner-text="'Goals: ' + (($ws.project?.goals || []).join(' · ') || 'None yet')"
          ></div>
          <div
            class="mt-1 text-xs text-zinc-400"
            bind-inner-text="'Recent updates: ' + (($ws.project?.recentUpdates || []).join(' · ') || 'None yet')"
          ></div>
          <div
            class="mt-1 text-xs text-zinc-400"
            bind-inner-text="'Next steps: ' + (($ws.project?.nextSteps || []).join(' · ') || 'None yet')"
          ></div>
        </section>
        <div class="px-3 pt-3 flex justify-between items-center">
          <span class="text-xs uppercase text-zinc-400">Sessions</span
          ><button
            aria-label="Create session"
            title="Create session"
            class="p-2 focus-visible:outline focus-visible:outline-2"
            bind-disabled="!$ws.workspace"
            on-click="$s.createSession(); $app.chatVisible = true"
          >
            ＋
          </button>
        </div>
        <nav aria-label="Sessions" class="flex-1 overflow-y-auto p-2">
          <button
            class="w-full rounded px-3 py-2 text-left text-sm text-emerald-300 hover:bg-zinc-800"
            on-click="$s.createSession({ role: 'planner' }); $app.chatVisible = true"
          >
            Planner · New planning session
          </button>
          <div class="px-3 pt-3 text-xs uppercase text-zinc-400">Delegated tasks</div>
          <template for="task of $ws.tasks"
            ><div class="px-3 py-2 text-xs text-zinc-300">
              <div bind-inner-text="task.task || task.title || task.id || 'Task'"></div>
              <div
                class="text-zinc-500"
                bind-inner-text="(task.role || 'task') + ' · ' + (task.status || 'unknown')"
              ></div>
              <div class="text-zinc-500" class-hidden="task.status !== 'queued'">Queued — not running</div>
            </div></template
          >
          <div class="px-3 pt-3 text-xs uppercase text-zinc-400">Regular sessions</div>
          <template for="s of $s.sessionList"
            ><div
              class="flex items-center rounded hover:bg-zinc-800"
              bind-class="{ 'bg-zinc-800': $s.sessionId === s.id }"
            >
              <button
                class="flex-1 text-left p-3 truncate focus-visible:outline focus-visible:outline-2"
                bind-inner-text="s.title || s.id"
                on-click="$s.setSessionById(s.id); $app.chatVisible = true"
              ></button
              ><button
                aria-label="Delete session"
                title="Delete session"
                class="p-2 text-zinc-400 hover:text-red-400"
                on-click="onDeleteSession(s.id)"
              >
                ×
              </button>
            </div></template
          >
        </nav>
        <div class="p-3 border-t border-zinc-800 flex gap-2">
          <button class="text-sm" on-click="onCreateWorkspace()">＋ Workspace</button>
        </div>
      </aside>
      <main class="flex-1 min-w-0 h-dvh"><app-chat class="h-full block"></app-chat></main>
    </template>
    <template if="!$p.profile"
      ><div class="m-auto">
        <button on-click="signIn(true)" class="rounded border border-zinc-700 p-3">Sign in</button>
      </div></template
    >
  </div>
  <script setup>
    import { onInit } from "@li3/web";
    import { useWorkspaces } from "@app/store/workspaces.mjs";
    import { useSessions } from "@app/store/sessions.mjs";
    import { useProfile } from "@app/store/profile.mjs";
    import { signIn, signOut } from "@app/store/profile.mjs";
    import { useApp } from "@app/store/app.mjs";
    export default function () {
      const $ws = useWorkspaces(),
        $s = useSessions(),
        $p = useProfile(),
        $app = useApp();
      onInit(async () => {
        await $p.reloadProfile();
        if ($p.profile) {
          await $ws.reloadWorkspaceList();
        }
      });
      async function onCreateWorkspace() {
        const name = prompt("Workspace name");
        if (!name?.trim()) return;
        try {
          await $ws.createWorkspace(name.trim());
          $app.chatVisible = true;
        } catch (error) {
          alert(`Could not create the workspace: ${error instanceof Error ? error.message : "Unknown error"}`);
        }
      }
      async function onDeleteSession(id) {
        if (confirm("Delete this session?")) {
          await $s.deleteSessionById(id);
        }
      }
      return { $ws, $s, $p, $app, signIn, signOut, onCreateWorkspace, onDeleteSession };
    }
  </script>
</template>
