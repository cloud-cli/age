<template component="app-main">
  <div class="bg-zinc-950 text-zinc-100 font-sans h-dvh">
    <app-header class="absolute h-12 w-full"></app-header>
    <template if="$p.profile">
      <main class="flex-1 flex flex-col justify-stretch items-stretch h-dvh pt-12 overflow-hidden">
        <div class="flex items-center justify-center w-full h-4">
          <button
            on-click="$app.toggleLayout('left')"
            class="inline-block rounded-full p-1"
            bind-class="{ 'text-blue-400': t.left, 'text-white-400': !t.left }"
            title="Toggle left panel"
          >
            <lucide-icon size="16" icon="panel-left"></lucide-icon>
          </button>
          <button
            on-click="$app.toggleLayout('center')"
            class="inline-block rounded-full p-1"
            bind-class="{ 'text-blue-400': t.center, 'text-white-400': !t.center }"
            title="Toggle center panel"
          >
            <lucide-icon size="16" icon="square-menu"></lucide-icon>
          </button>
          <button
            on-click="$app.toggleLayout('right')"
            class="inline-block rounded-full p-1"
            bind-class="{ 'text-blue-400': t.right, 'text-white-400': !t.right }"
            title="Toggle right panel"
          >
            <lucide-icon size="16" icon="panel-right"></lucide-icon>
          </button>
        </div>

        <div class="flex items-center justify-stretch w-full h-full" class-hidden="!$p.profile || !$ws.workspace" bind-p="$p.profile" bind-ws="$ws.workspace">
          <app-chat
            class="h-full flex-1 w-full"
            style-max-width="`calc(100% / ${ [t.left, t.center, t.right].filter(Boolean).length })`"
            class-hidden="!t.left"
          ></app-chat>

          <div
            class="h-full flex-1 w-full"
            style-max-width="`calc(100% / ${ [t.left, t.center, t.right].filter(Boolean).length })`"
            class-hidden="!t.center"
          >
            <code-editor
              class="h-full w-full"
              class-hidden="!$f.selectedFile"
              bind-status="$f.selectedFile?.path || ''"
              bind-value="$f.selectedFile?.content || ''"
              on-change="$f.setFileContent($event.target.value)"
            ></code-editor>
          </div>

          <app-files
            class="h-full flex-1 w-full"
            style-max-width="`calc(100% / ${ [t.left, t.center, t.right].filter(Boolean).length })`"
            class-hidden="!t.right"
          ></app-files>
        </div>
      </main>
    </template>
  </div>
  <script setup>
    import { computed } from '@li3/web';
    import { useApp } from '@app/store/app.mjs';
    import { useWorkspaces } from '@app/store/workspaces.mjs';
    import { useProfile } from '@app/store/profile.mjs';
    import { useFiles } from '@app/store/files.mjs';

    window.addEventListener('unhandledrejection', (event) => console.error(event));

    export default function () {
      const $app = useApp();
      const $f = useFiles();
      const $p = useProfile();
      const $ws = useWorkspaces();
      const t = computed(() => $.layout);

      return { $app, $f, $p, $ws, t };
    }
  </script>
</template>
