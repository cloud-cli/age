<template component="workspace-list">
  <nav aria-label="Workspaces" class="p-2 space-y-1 flex-1 overflow-y-auto">
    <div data-workspace-items></div>
    <p data-workspace-empty class="px-2 py-1 text-xs text-zinc-500">No workspaces yet</p>
    <h2 data-archived-heading class="mt-4 px-2 py-1 text-xs font-semibold text-zinc-500">Archived</h2>
    <div data-archived-items></div>
  </nav>
  <script setup>
    import { getElement, onInit } from "@li3/web";
    import { Workspaces } from "@app/api.mjs";
    import { useWorkspaces } from "@app/store/workspaces.mjs";
    import { useApp } from "@app/store/app.mjs";

    export default function () {
      const element = getElement();
      const $ws = useWorkspaces();
      const $app = useApp();

      async function reload() {
        const [workspaces, allWorkspaces] = await Promise.all([Workspaces.list(), Workspaces.list(true)]);
        const items = element.querySelector("[data-workspace-items]");
        const empty = element.querySelector("[data-workspace-empty]");
        items.replaceChildren(
          ...workspaces.map((workspace) => {
            const button = document.createElement("button");
            button.type = "button";
            button.className =
              "w-full break-all rounded-lg px-3 py-2 text-left text-sm font-medium text-slate-700 hover:bg-white focus-visible:outline focus-visible:outline-2";
            button.textContent = workspace.name;
            if (workspace.name === $ws.workspace && element.closest("dialog")) {
              button.setAttribute("aria-current", "true");
              button.classList.add("bg-white", "text-[#547d42]");
            }
            button.addEventListener("click", () => {
              $app.openWorkspace(workspace.name);
              if (element.closest("dialog")) {
                for (const workspaceButton of items.querySelectorAll("button")) {
                  if (workspaceButton === button) {
                    workspaceButton.setAttribute("aria-current", "true");
                    workspaceButton.classList.add("bg-white", "text-[#547d42]");
                  } else {
                    workspaceButton.removeAttribute("aria-current");
                    workspaceButton.classList.remove("bg-white", "text-[#547d42]");
                  }
                }
              }
              window.dispatchEvent(new Event("age:workspace-selected"));
            });
            return button;
          }),
        );
        empty.hidden = workspaces.length > 0;
        const archived = allWorkspaces.filter((workspace) => workspace.archived);
        element.querySelector("[data-archived-heading]").hidden = archived.length === 0;
        element.querySelector("[data-archived-items]").replaceChildren(
          ...archived.map((workspace) => {
            const row = document.createElement("div");
            row.className = "flex items-center gap-1 px-2 py-1";
            const label = document.createElement("span");
            label.className = "min-w-0 flex-1 break-all text-xs text-zinc-500";
            label.textContent = workspace.name;
            const restore = document.createElement("button");
            restore.type = "button";
            restore.className = "rounded px-2 py-1 text-xs text-[#547d42]";
            restore.textContent = "Restore";
            restore.addEventListener("click", async () => {
              try {
                await $ws.restoreWorkspace(workspace.name);
              } catch (error) {
                alert(error.message);
              }
            });
            row.append(label, restore);
            return row;
          }),
        );
      }

      onInit(() => {
        reload().catch(console.error);
        window.addEventListener("age:workspaces-changed", reload);
      });

      return { $ws };
    }
  </script>
</template>

              <p class="text-sm font-medium text-[#547d42]">WORKSPACE</p>
              <h1 class="text-3xl font-semibold">Sessions</h1>

            <button
              class="mt-3 font-medium text-[#547d42]"

          <button
            class="flex flex-col items-center justify-center gap-1 text-xs"
            bind-class="{ 'text-[#547d42]': $app.page === 'workspaces' || $app.page === 'overview', 'text-zinc-500': $app.page !== 'workspaces' && $app.page !== 'overview' }"
            bind-aria-current="$app.page === 'workspaces' ? 'page' : null"

          >
            <lucide-icon icon="layout-grid" size="20" aria-hidden="true"></lucide-icon><span>Workspaces</span>
          </button>
          <button
            class="flex flex-col items-center justify-center gap-1 text-xs"
            bind-class="{ 'text-[#547d42]': $app.page === 'sessions', 'text-zinc-500': $app.page !== 'sessions' }"
            bind-aria-current="$app.page === 'sessions' ? 'page' : null"
            on-click="openSessions()"
          >
            <lucide-icon icon="messages-square" size="20" aria-hidden="true"></lucide-icon><span>Sessions</span>
          </button>
          <button
            class="flex flex-col items-center justify-center gap-1 text-xs"
            bind-class="{ 'text-[#547d42]': $app.page === 'chat', 'text-zinc-500': $app.page !== 'chat' }"
            bind-aria-current="$app.page === 'chat' ? 'page' : null"
            on-click="openChatPage()"
          >
            <lucide-icon icon="message-circle" size="20" aria-hidden="true"></lucide-icon><span>Chat</span>
          </button>
          <button
            class="flex flex-col items-center justify-center gap-1 text-xs"

            on-click="openTasks()"
          >
            <lucide-icon icon="list-checks" size="20" aria-hidden="true"></lucide-icon><span>Tasks</span>
          </button>
          <button
            class="flex flex-col items-center justify-center gap-1 text-xs"
            bind-class="{ 'text-[#547d42]': $app.page === 'user-settings' || $app.page === 'integrations', 'text-zinc-500': $app.page !== 'user-settings' && $app.page !== 'integrations' }"
            bind-aria-current="$app.page === 'user-settings' || $app.page === 'integrations' ? 'page' : null"
            on-click="openIntegrations()"
          >
            <lucide-icon icon="plug" size="20" aria-hidden="true"></lucide-icon><span>Integrations</span>
          </button>

    </template>
    <template if="!$p.profile"
      ><div class="m-auto">
        <button on-click="signIn(true)" class="rounded border border-slate-300 p-3">Sign in</button>
      </div></template
    >
  </div>
  <script setup>
    import { effect, getElement, onInit } from "@li3/web";
    import { useWorkspaces } from "@app/store/workspaces.mjs";
    import { useSessions } from "@app/store/sessions.mjs";
    import { useProfile } from "@app/store/profile.mjs";
    import { signIn, signOut } from "@app/store/profile.mjs";
    import { useApp } from "@app/store/app.mjs";
    import { useMessages } from "@app/store/messages.mjs";
    import { Connectors, Sessions, Teams, Workspaces, events } from "@app/api.mjs";
    export default function () {
      const element = getElement();
      const $ws = useWorkspaces(),
        $s = useSessions(),
        $p = useProfile(),
        $app = useApp(),
        $msg = useMessages();
      let activeGoalId = "";
      let activeTask = null;
      let appReady = false;
      let displayedWorkspace = "";
      let displayedPage = $app.page;
      let mobileDrawer;
      let mobileMenuButton;

      function closeMobileDrawer({ restoreFocus = true } = {}) {
        const wasOpen = Boolean(mobileDrawer?.open);
        if (wasOpen) {
          mobileDrawer.close();
        }
        mobileMenuButton?.setAttribute("aria-expanded", "false");
        if (wasOpen && restoreFocus && mobileMenuButton && window.matchMedia("(max-width: 767px)").matches) {
          mobileMenuButton.focus();
        }
      }

      function openMobileDrawer() {
        if (!mobileDrawer || !window.matchMedia("(max-width: 767px)").matches || mobileDrawer.open) {
          return;
        }
        mobileMenuButton.setAttribute("aria-expanded", "true");
        mobileDrawer.showModal();
        element.querySelector("[data-close-mobile-drawer]").focus();
      }

      window.addEventListener("age:workspace-selected", () => closeMobileDrawer());

      async function refreshTeam() {
        const team = await Teams.current();
        const summary = element.querySelector("[data-team-summary]");
        const members = element.querySelector("[data-team-members]");
        summary.textContent = team.id
          ? `${team.name} · ${team.role}`
          : "You are not in a team. Create a team to share integrations.";
        element.querySelector("[data-team-invite-button]").hidden = !["owner", "admin"].includes(team.role);
        members.replaceChildren(
          ...(team.members || []).map((member) => {
            const item = document.createElement("li");
            item.textContent = `${member.sub} · ${member.role}`;
            return item;
          }),
        );
      }
      async function createTeam() {
        try {
          await Teams.create(prompt("Team name") || "My team");
          await refreshTeam();
        } catch (error) {
          alert(error.message);
        }
      }
      async function addTeamMember() {
        try {
          const subject = prompt("Enter the invitee's OIDC subject");
          if (!subject?.trim()) {
            return;
          }
          await Teams.addMember(subject.trim());
          await refreshTeam();
        } catch (error) {
          alert(error.message);
        }
      }
      function renderWorkspaceSettings() {
        const description = $ws.settings.description || "";
        const descriptionInput = element.querySelector("[data-workspace-description]");
        const descriptionText = element.querySelector("[data-description-text]");
        const descriptionEmpty = element.querySelector("[data-description-empty]");
        const descriptionEditor = element.querySelector("[data-description-editor]");
        const descriptionEdit = element.querySelector("[data-description-edit]");
        if (descriptionInput) descriptionInput.value = description;
        if (descriptionText) {
          descriptionText.textContent = description;
          descriptionText.hidden = !description;
        }
        if (descriptionEmpty) descriptionEmpty.hidden = !!description;
        if (descriptionEditor) descriptionEditor.hidden = true;
        if (descriptionEdit) descriptionEdit.hidden = !description;
        const list = element.querySelector("[data-goals-list]");
        if (!list) return;
        const goals = $ws.settings.goals || [];
        list.replaceChildren(
          ...goals.map((goal) => {
            const card = document.createElement("article");
            card.className = "flex items-center gap-3 rounded-xl border border-zinc-200 bg-white p-4";
            const open = document.createElement("button");
            open.className = "min-w-0 flex-1 text-left";
            const title = document.createElement("span");
            title.className = "block font-semibold";
            title.textContent = goal.title;
            const desc = document.createElement("span");
            desc.className = "mt-1 block truncate text-sm text-zinc-500";
            desc.textContent = goal.description || "No description";
            open.append(title, desc);
            open.addEventListener("click", () => {
              activeGoalId = goal.id;
              $app.openGoal(goal.id);
              renderGoal();
            });
            const edit = document.createElement("button");
            edit.className = "rounded border px-3 py-2 text-sm";
            edit.textContent = "Edit";
            edit.addEventListener("click", () => editGoal(goal));
            const remove = document.createElement("button");
            remove.className = "rounded px-2 py-2 text-sm text-red-700";
            remove.textContent = "Remove";
            remove.addEventListener("click", () => removeGoal(goal.id));
            card.append(open, edit, remove);
            return card;
          }),
        );
        const goalsEmpty = element.querySelector("[data-goals-empty]");
        if (goalsEmpty) goalsEmpty.hidden = goals.length > 0;
      }
      function renderUserModels() {
        const host = element.querySelector("[data-user-model-groups]");
        if (!host) return;
        const models = Array.isArray($msg.modelList)
          ? $msg.modelList
          : Array.isArray($msg.modelList?.models)
            ? $msg.modelList.models
            : Array.isArray($msg.modelList?.data)
              ? $msg.modelList.data
              : [];
        const groups = new Map();
        let preferences = { providers: {}, models: {} };
        try {
          const stored = JSON.parse(localStorage.getItem("age-model-picker-preferences") || "{}");
          if (stored && typeof stored === "object" && !Array.isArray(stored)) {
            preferences.providers =
              stored.providers && typeof stored.providers === "object" && !Array.isArray(stored.providers)
                ? stored.providers
                : {};
            preferences.models =
              stored.models && typeof stored.models === "object" && !Array.isArray(stored.models) ? stored.models : {};
          }
        } catch {}
        for (const model of models) {
          if (!model?.id) continue;
          const provider = model.provider || model.serverName || "Other";
          if (!groups.has(provider)) groups.set(provider, []);
          groups.get(provider).push(model);
        }
        host.replaceChildren(
          ...[...groups].map(([provider, items]) => {
            const section = document.createElement("section");
            section.className = "rounded-lg border border-slate-200 p-3";
            const title = document.createElement("label");
            title.className = "flex items-center gap-2 font-medium";
            const providerToggle = document.createElement("input");
            providerToggle.type = "checkbox";
            providerToggle.checked = preferences.providers?.[provider] !== false;
            providerToggle.addEventListener("change", () => {
              preferences.providers = { ...preferences.providers, [provider]: providerToggle.checked };
              preferences.models = {
                ...preferences.models,
                ...Object.fromEntries(items.map((model) => [model.id, providerToggle.checked])),
              };
              localStorage.setItem("age-model-picker-preferences", JSON.stringify(preferences));
              renderUserModels();
            });
            const providerName = document.createElement("span");
            providerName.textContent = provider;
            title.append(providerToggle, providerName);
            section.append(title);
            for (const model of items) {
              const label = document.createElement("label");
              label.className = "mt-2 flex items-center gap-2 text-sm";
              const checkbox = document.createElement("input");
              checkbox.type = "checkbox";
              checkbox.checked =
                preferences.providers?.[provider] !== false && preferences.models?.[model.id] !== false;
              checkbox.addEventListener("change", () => {
                preferences.models = { ...preferences.models, [model.id]: checkbox.checked };
                preferences.providers = {
                  ...preferences.providers,
                  [provider]: items.some((item) => preferences.models[item.id] !== false),
                };
                localStorage.setItem("age-model-picker-preferences", JSON.stringify(preferences));
                renderUserModels();
              });
              const text = document.createElement("span");
              text.textContent = model.name || model.id;
              label.append(checkbox, text);
              section.append(label);
            }
            return section;
          }),
        );
        element.querySelector("[data-user-model-empty]").hidden = models.length > 0;
      }
      async function reloadUserModels() {
        try {
          await $msg.reloadModelList();
          renderUserModels();
        } catch (error) {
          console.error(error);
        }
      }
      function resetUserModelFilters() {
        localStorage.setItem("age-model-picker-preferences", JSON.stringify({ providers: {}, models: {} }));
        renderUserModels();
      }
      async function renderWorkspaceHome() {
        if (!$ws.workspace) return;
        const sessions = [...(await Sessions.list($ws.workspace))].sort(
          (a, b) => Number(b.updatedAt || b.createdAt || 0) - Number(a.updatedAt || a.createdAt || 0),
        );
        const recent = element.querySelector("[data-recent-sessions]");
        recent.replaceChildren(
          ...sessions.map((session) => {
            const button = document.createElement("button");
            button.className = "block w-full rounded-lg border bg-white p-1 px-2 text-left text-sm";
            button.textContent = `${session.title || "Untitled conversation"} · ${new Date(Number(session.updatedAt || session.createdAt || 0)).toLocaleString()}`;
            button.addEventListener("click", () => openSession(session.id));
            return button;
          }),
        );
        element.querySelector("[data-recent-empty]").hidden = sessions.length > 0;
        const tasks = await Workspaces.tasks($ws.workspace);
        for (const status of ["todo", "in-progress", "done", "verified"]) {
          const target = element.querySelector(`[data-overview-main] [data-task-column="${status}"] > div`);
          target.replaceChildren(
            ...tasks
              .filter((task) => (task.status === "new" ? "todo" : task.status || "todo") === status)
              .map((task) => {
                const button = document.createElement("button");
                button.className = "w-full rounded-lg border bg-white p-3 text-left";
                button.textContent = `${task.title || task.task || "Task"}${task.execution?.phase ? ` · ${task.execution.phase}` : ""}`;
                button.draggable = true;
                button.dataset.taskId = task.id;
                button.addEventListener("dragstart", (event) => {
                  event.dataTransfer.setData("text/plain", task.id);
                  event.dataTransfer.effectAllowed = "move";
                });
                button.addEventListener("click", () => showTask(task));
                return button;
              }),
          );
          const column = element.querySelector(`[data-overview-main] [data-task-column="${status}"]`);
          column.ondragover = (event) => event.preventDefault();
          column.ondrop = (event) => {
            event.preventDefault();
            const id = event.dataTransfer.getData("text/plain");
            const task = tasks.find((item) => item.id === id);
            if (task && task.status !== status) {
              moveTask(task, status).catch((error) => alert(error.message));
            }
          };
        }
      }
      async function renderSessionList() {
        if (!$ws.workspace) return;
        const sessions = await Sessions.list($ws.workspace);
        const list = element.querySelector("[data-session-list]");
        list.replaceChildren(

          form.append(label);
        };
        addInput("Server name", "name", "text", connector.name, "Home Ollama", true);
        addInput("Server URL", "url", "url", connector.url, "https://ollama.example.com", true);
        addInput("Default model", "model", "text", connector.model, "llama3.2");

        const actions = document.createElement("div");
        actions.className = "flex flex-wrap gap-2";
        const addButton = (label, className, handler, submit = false) => {
          const button = document.createElement("button");
          button.type = submit ? "submit" : "button";
          button.className = className;
          button.textContent = label;
          if (handler) {
            button.addEventListener("click", handler);
          }
          actions.append(button);
        };
        addButton("Save server", "rounded bg-[#547d42] px-3 py-2 text-sm", null, true);

        );
        if (connector.id) {
          addButton("Disconnect", "rounded px-3 py-2 text-sm text-red-700", () => removeConnector("ollama", form));
        }
        form.append(actions);
        form.addEventListener("submit", (event) => {
          event.preventDefault();
          saveConnector(event);
        });
        return form;
      }

        list.replaceChildren(...(connectors.length ? connectors.map(createOllamaForm) : [createOllamaForm()]));
