<template component="project-list">
  <nav aria-label="Projects" class="p-2 border-b border-zinc-800 space-y-1">
    <div class="px-2 py-1 text-xs uppercase tracking-wide text-zinc-400">Projects</div>
    <div data-project-items></div>
    <p data-project-empty class="px-2 py-1 text-xs text-zinc-500">No projects yet</p>
  </nav>
  <script setup>
    import { getElement, onInit } from "@li3/web";
    import { Workspaces } from "@app/api.mjs";
    import { useWorkspaces } from "@app/store/workspaces.mjs";
    import { useApp } from "@app/store/app.mjs";

    export default function () {
      const element = getElement();
      const $ws = useWorkspaces();
      const $app = useApp();

      async function reload() {
        const workspaces = await Workspaces.list();
        const items = element.querySelector("[data-project-items]");
        const empty = element.querySelector("[data-project-empty]");
        items.replaceChildren(
          ...workspaces.map((workspace) => {
            const button = document.createElement("button");
            button.type = "button";
            button.className =
              "w-full rounded px-3 py-2 text-left text-sm hover:bg-zinc-800 focus-visible:outline focus-visible:outline-2";
            button.textContent = workspace.name;
            button.addEventListener("click", () => {
              $ws.setWorkspace(workspace.name);
              $app.openOverview();
            });
            return button;
          }),
        );
        empty.hidden = workspaces.length > 0;
      }

      onInit(() => {
        reload().catch(console.error);
        window.addEventListener("age:workspaces-changed", reload);
      });

      return { $ws };
    }
  </script>
</template>

            class="flex flex-col items-center justify-center gap-1 text-xs"
            bind-class="{ 'text-emerald-700': $app.page === 'sessions', 'text-zinc-500': $app.page !== 'sessions' }"
            bind-aria-current="$app.page === 'sessions' ? 'page' : null"
            on-click="openSessions()"
          >
            <span aria-hidden="true">☰</span><span>Sessions</span>
          </button>
          <button
            class="flex flex-col items-center justify-center gap-1 text-xs"
            bind-class="{ 'text-emerald-700': $app.page === 'chat', 'text-zinc-500': $app.page !== 'chat' }"
            bind-aria-current="$app.page === 'chat' ? 'page' : null"
            on-click="openChatPage()"
          >
            <span aria-hidden="true">◌</span><span>Chat</span>
          </button>
          <button
            class="flex flex-col items-center justify-center gap-1 text-xs"
            bind-class="{ 'text-emerald-700': $app.page === 'tasks', 'text-zinc-500': $app.page !== 'tasks' }"
            bind-aria-current="$app.page === 'tasks' ? 'page' : null"
            on-click="openTasks()"
          >
            <span aria-hidden="true">✓</span><span>Tasks</span>
          </button>
          <button
            class="flex flex-col items-center justify-center gap-1 text-xs"
            bind-class="{ 'text-emerald-700': $app.page === 'integrations', 'text-zinc-500': $app.page !== 'integrations' }"
            bind-aria-current="$app.page === 'integrations' ? 'page' : null"
            on-click="openConnectors()"
          >
            <span aria-hidden="true">◇</span><span>Integrations</span>
          </button>
        </div>
      </nav>
    </template>
    <template if="!$p.profile"
      ><div class="m-auto">
        <button on-click="signIn(true)" class="rounded border border-zinc-700 p-3">Sign in</button>
      </div></template
    >
  </div>
  <script setup>
    import { effect, getElement, onInit } from "@li3/web";
    import { useWorkspaces } from "@app/store/workspaces.mjs";
    import { useSessions } from "@app/store/sessions.mjs";
    import { useProfile } from "@app/store/profile.mjs";
    import { signIn, signOut } from "@app/store/profile.mjs";
    import { useApp } from "@app/store/app.mjs";
    import { useMessages } from "@app/store/messages.mjs";
    import { Connectors, Teams } from "@app/api.mjs";
    export default function () {
      const element = getElement();
      const $ws = useWorkspaces(),
        $s = useSessions(),
        $p = useProfile(),
        $app = useApp(),
        $msg = useMessages();
      async function refreshTeam() {
        const team = await Teams.current();
        const summary = element.querySelector("[data-team-summary]");
        const members = element.querySelector("[data-team-members]");
        summary.textContent = team.id
          ? `${team.name} · ${team.role}`
          : "You are not in a team. Create a team to share integrations.";
        element.querySelector("[data-team-invite-button]").hidden = !["owner", "admin"].includes(team.role);
        members.replaceChildren(
          ...(team.members || []).map((member) => {
            const item = document.createElement("li");
            item.textContent = `${member.sub} · ${member.role}`;
            return item;
          }),
        );
      }
      async function createTeam() {
        try {
          await Teams.create(prompt("Team name") || "My team");
          await refreshTeam();
        } catch (error) {
          alert(error.message);
        }
      }
      async function addTeamMember() {
        try {
          const subject = prompt("Enter the invitee's OIDC subject");
          if (!subject?.trim()) {
            return;
          }
          await Teams.addMember(subject.trim());
          await refreshTeam();
        } catch (error) {
          alert(error.message);
        }
      }
      function syncPages() {
        const sidebar = element.querySelector("aside");
        if (!sidebar) {
          return;
        }
        const visibility = [
          [sidebar, $app.page !== "integrations"],
          [element.querySelector("[data-connectors-page]"), $app.page === "integrations"],
          [element.querySelector("[data-workspaces-main]"), $app.page === "workspaces"],
          [element.querySelector("[data-overview-main]"), $app.page === "overview"],
          [element.querySelector("[data-sessions-main]"), $app.page === "sessions"],
          [element.querySelector("[data-tasks-main]"), $app.page === "tasks"],
          [element.querySelector("[data-chat-main]"), $app.page === "chat"],
        ];
        for (const [node, visible] of visibility) {
          node.hidden = !visible;
          node.style.display = visible ? "" : "none";
        }
      }
      effect(() => `${$app.page}:${$app.isCompact}`, syncPages);
      onInit(async () => {
        await $p.reloadProfile();
        if ($p.profile) {
          await $ws.reloadWorkspaceList();
          if (!$ws.workspace && $app.page === "overview") {
            $app.openSidebar();
          }
        }
        syncPages();
        if ($p.profile) refreshTeam().catch(console.error);
      });
      async function onCreateWorkspace() {
        const name = prompt("Workspace name");
        if (!name?.trim()) return;
        try {
          await $ws.createWorkspace(name.trim());
          $app.openOverview();
        } catch (error) {
          alert(`Could not create the workspace: ${error instanceof Error ? error.message : "Unknown error"}`);
        }
      }

      function showProjectOverview() {
        $app.openOverview();
      }

      function openWorkspaces() {
        $app.openSidebar();
      }

      function selectWorkspace(name) {
        $ws.setWorkspace(name);
        $app.openOverview();
      }

      function openOverview() {
        $app.openOverview();
      }

      function openSessions() {
        $app.openSessions();
      }

      function openTasks() {
        $app.openTasks();
      }

      function openIntegrations() {
        openConnectors();
      }

      function openChatPage() {
        $app.openChat();
      }

      async function createSession() {
        await $s.createSession();
        $app.openChat();
      }

      async function createPlannerSession() {
        await $s.createSession({ role: "planner", title: "Planner" });
        $app.openChat();
      }

      async function openSession(id) {
        await $s.setSessionById(id);
        $app.openChat();
      }

      async function onDeleteSession(id) {
        if (confirm("Delete this session?")) {
          await $s.deleteSessionById(id);
        }
      }
      async function openConnectors() {
        $app.openIntegrations();
        const page = element.querySelector("[data-connectors-page]");
        page.querySelector("[data-page-status]").textContent = "";
        try {
          const connectors = await Connectors.list();
          const chatgpt = connectors.find((connector) => connector.provider === "chatgpt");
          page.querySelector("[data-chatgpt-status]").textContent = chatgpt?.configured
            ? `Connected${chatgpt.model ? ` · default model: ${chatgpt.model}` : ""}`
            : "Not connected";
          page.querySelector("[data-chatgpt-disconnect]").hidden = !chatgpt?.configured;
          for (const connector of connectors) {
            if (connector.provider === "ollama" || connector.provider === "chatgpt") {
              continue;
            }
            const form = page.querySelector(`[data-provider-form="${connector.provider}"]`);
            const status = form.querySelector(`[data-provider-status="${connector.provider}"]`);
            status.textContent = connector.configured
              ? `Configured${connector.model ? ` · default model: ${connector.model}` : ""}`
              : "Not connected";
            form.elements.model.value = connector.model;
          }
          renderOllamaServers(connectors.filter((connector) => connector.provider === "ollama"));
        } catch (error) {
          page.querySelector("[data-page-status]").textContent = error.message;
        }
      }
      async function saveConnector(event) {
        const form = event.currentTarget;
        const values = Object.fromEntries(new FormData(form));
        const provider = form.dataset.providerForm;
        values.provider = provider;
        if (provider === "ollama" && form.dataset.connectorId) {
          values.id = form.dataset.connectorId;
        }
        const status = form.querySelector(`[data-provider-status="${provider}"]`);
        status.textContent = "Saving…";
        try {
          const connector = await Connectors.save(values);
          status.textContent = `${connector.provider} settings saved. Test the connection to load available models.`;
          if (connector.provider === "ollama") {
            form.dataset.connectorId = connector.id;
            form.querySelector("[data-connector-name]").textContent = connector.name;
          }
          if (form.elements.credential) {
            form.elements.credential.value = "";
          }
          await $msg.reloadModelList();
        } catch (error) {
          status.textContent = error.message;
        }
      }
      async function testConnector(provider, form = element.querySelector(`[data-provider-form="${provider}"]`)) {
        const status = form.querySelector(`[data-provider-status="${provider}"]`);
        if (provider === "ollama" && !form.dataset.connectorId) {
          status.textContent = "Save this server before testing its connection.";
          return;
        }
        status.textContent = "Testing connection…";
        try {
          const models = await Connectors.test(provider, form.dataset.connectorId);
          status.textContent = `Connected · ${models.length} model${models.length === 1 ? "" : "s"} available`;
          if (!form.elements.model.value && models.length) {
            form.elements.model.value = models[0].name;
          }
        } catch (error) {
          status.textContent = error.message;
        }
      }
      async function removeConnector(provider, form = element.querySelector(`[data-provider-form="${provider}"]`)) {
        if (!confirm(`Disconnect ${provider}?`)) {
          return;
        }
        if (provider === "chatgpt") {
          const status = element.querySelector("[data-chatgpt-status]");
          try {
            await Connectors.remove(provider);
            status.textContent = "Disconnected";
            element.querySelector("[data-chatgpt-disconnect]").hidden = true;
            await $msg.reloadModelList();
          } catch (error) {
            status.textContent = error.message;
          }
          return;
        }
        const status = form.querySelector(`[data-provider-status="${provider}"]`);
        try {
          await Connectors.remove(provider, form.dataset.connectorId);
          if (provider === "ollama") {
            const connectors = await Connectors.list();
            renderOllamaServers(connectors.filter((connector) => connector.provider === "ollama"));
          } else {
            form.reset();
            status.textContent = "Disconnected";
          }
          await $msg.reloadModelList();
        } catch (error) {
          status.textContent = error.message;
        }
      }
      async function connectChatgpt() {
        const status = element.querySelector("[data-chatgpt-status]");
        const link = element.querySelector("[data-chatgpt-link]");
        const button = element.querySelector("[data-chatgpt-connect]");
        button.disabled = true;
        link.hidden = true;
        try {
          const login = await Connectors.startChatgptLogin();
          link.href = login.verificationUrl;
          link.textContent = `Open ${login.verificationUrl} and enter code: ${login.userCode}`;
          link.hidden = false;
          status.textContent = "Open the verification link, enter the code, and approve access in OpenAI.";
          while (true) {
            await new Promise((resolve) => window.setTimeout(resolve, login.interval * 1000));
            const result = await Connectors.pollChatgptLogin(login.loginId);
            if (!result.pending) {
              link.hidden = true;
              status.textContent = "Connected to ChatGPT. Choose a ChatGPT model in Chat.";
              element.querySelector("[data-chatgpt-disconnect]").hidden = false;
              await $msg.reloadModelList();
              return;
            }
          }
        } catch (error) {
          status.textContent = error.message;
          button.disabled = false;
        }
      }
      function createOllamaForm(connector = {}) {
        const form = document.createElement("form");
        form.dataset.providerForm = "ollama";
        if (connector.id) {
          form.dataset.connectorId = connector.id;
        }
        form.className = "space-y-4 rounded-xl border border-zinc-800 bg-zinc-950 p-4";

        const heading = document.createElement("h3");
        heading.className = "font-medium";
        heading.dataset.connectorName = "";
        heading.textContent = connector.name || "New Ollama server";
        form.append(heading);

        const status = document.createElement("p");
        status.className = "text-xs text-zinc-400";
        status.dataset.providerStatus = "ollama";
        status.setAttribute("role", "status");
        status.textContent = connector.id ? "Configured" : "Not saved";
        form.append(status);

        const addInput = (labelText, name, type, value, placeholder, required = false) => {
          const label = document.createElement("label");
          label.className = "block text-sm";
          label.append(document.createTextNode(labelText));
          const input = document.createElement("input");
          input.name = name;
          input.type = type;
          input.value = value || "";
          input.placeholder = placeholder;
          input.required = required;
          input.className = "mt-1 w-full rounded bg-zinc-800 p-2";
          label.append(input);
          form.append(label);
        };
        addInput("Server name", "name", "text", connector.name, "Home Ollama", true);
        addInput("Server URL", "url", "url", connector.url, "https://ollama.example.com", true);
        addInput("Default model", "model", "text", connector.model, "llama3.2");

        const actions = document.createElement("div");
        actions.className = "flex flex-wrap gap-2";
        const addButton = (label, className, handler, submit = false) => {
          const button = document.createElement("button");
          button.type = submit ? "submit" : "button";
          button.className = className;
          button.textContent = label;
          if (handler) {
            button.addEventListener("click", handler);
          }
          actions.append(button);
        };
        addButton("Save server", "rounded bg-emerald-700 px-3 py-2 text-sm", null, true);
        addButton("Test connection", "rounded border border-zinc-700 px-3 py-2 text-sm", () =>
          testConnector("ollama", form),
        );
        if (connector.id) {
          addButton("Disconnect", "rounded px-3 py-2 text-sm text-red-300", () => removeConnector("ollama", form));
        }
        form.append(actions);
        form.addEventListener("submit", (event) => {
          event.preventDefault();
          saveConnector(event);
        });
        return form;
      }
      function renderOllamaServers(connectors) {
        const list = element.querySelector("[data-ollama-servers]");
        list.replaceChildren(...(connectors.length ? connectors.map(createOllamaForm) : [createOllamaForm()]));
      }
      function addOllamaServer() {
        element.querySelector("[data-ollama-servers]").append(createOllamaForm());
      }
      return {
        createTeam,
        addTeamMember,
        $ws,
        $s,
        $p,
        $app,
        signIn,
        signOut,
        onCreateWorkspace,
        showProjectOverview,
        createSession,
        createPlannerSession,
        openSession,
        onDeleteSession,
        openConnectors,
        openWorkspaces,
        selectWorkspace,
        openOverview,
        openSessions,
        openTasks,
        openIntegrations,
        openChatPage,
        saveConnector,
        testConnector,
        removeConnector,
        connectChatgpt,
        addOllamaServer,
      };
    }
  </script>
</template>
