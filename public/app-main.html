<template component="workspace-list">
  <nav aria-label="Workspaces" class="p-2 space-y-1 flex-1 overflow-y-auto">
    <div data-workspace-items></div>
    <p data-workspace-empty class="px-2 py-1 text-xs text-zinc-500">No workspaces yet</p>
    <h2 data-archived-heading class="mt-4 px-2 py-1 text-xs font-semibold text-zinc-500">Archived</h2>
    <div data-archived-items></div>
  </nav>
  <script setup>
    import { getElement, onInit } from "@li3/web";
    import { Workspaces } from "@app/api.mjs";
    import { useWorkspaces } from "@app/store/workspaces.mjs";
    import { useApp } from "@app/store/app.mjs";

    export default function () {
      const element = getElement();
      const $ws = useWorkspaces();
      const $app = useApp();

      async function reload() {
        const [workspaces, allWorkspaces] = await Promise.all([Workspaces.list(), Workspaces.list(true)]);
        const items = element.querySelector("[data-workspace-items]");
        const empty = element.querySelector("[data-workspace-empty]");
        items.replaceChildren(
          ...workspaces.map((workspace) => {
            const button = document.createElement("button");
            button.type = "button";
            button.className =
              "w-full break-all rounded px-3 py-2 text-left text-sm text-zinc-700 hover:bg-zinc-100 focus-visible:outline focus-visible:outline-2";
            button.textContent = workspace.name;
            button.addEventListener("click", () => {
              $app.openWorkspace(workspace.name);
            });
            return button;
          }),
        );
        empty.hidden = workspaces.length > 0;
        const archived = allWorkspaces.filter((workspace) => workspace.archived);
        element.querySelector("[data-archived-heading]").hidden = archived.length === 0;
        element.querySelector("[data-archived-items]").replaceChildren(
          ...archived.map((workspace) => {
            const row = document.createElement("div");
            row.className = "flex items-center gap-1 px-2 py-1";
            const label = document.createElement("span");
            label.className = "min-w-0 flex-1 break-all text-xs text-zinc-500";
            label.textContent = workspace.name;
            const restore = document.createElement("button");
            restore.type = "button";
            restore.className = "rounded px-2 py-1 text-xs text-emerald-700";
            restore.textContent = "Restore";
            restore.addEventListener("click", async () => {
              try {
                await $ws.restoreWorkspace(workspace.name);
              } catch (error) {
                alert(error.message);
              }
            });
            row.append(label, restore);
            return row;
          }),
        );
      }

      onInit(() => {
        reload().catch(console.error);
        window.addEventListener("age:workspaces-changed", reload);
      });

      return { $ws };
    }
  </script>
</template>

              Choose a workspace first →
            </button>
          </div>
        </div>
      </main>
      <main
        data-tasks-main
        hidden
        class="flex-1 min-w-0 h-[calc(100dvh-5rem)] md:h-dvh overflow-y-auto bg-zinc-50 p-5 text-zinc-900 md:p-10"
      >
        <div class="mx-auto max-w-3xl">
          <button class="mb-4 text-sm font-medium text-emerald-700" on-click="openOverview()">
            ← Back to workspace
          </button>
          <p class="text-sm font-medium text-emerald-700">WORKSPACE</p>
          <h1 class="text-3xl font-semibold">Tasks</h1>
          <p class="mt-1 text-zinc-600">
            Work the agent has delegated for <span bind-inner-text="$ws.workspace || 'your workspace'"></span>.
          </p>
          <div class="mt-5 space-y-2">
            <template for="task of $ws.tasks"
              ><article class="rounded-xl border border-zinc-200 bg-white p-4 shadow-sm">
                <h2 class="font-semibold" bind-inner-text="task.task || task.title || task.id || 'Task'"></h2>
                <p
                  class="mt-1 text-sm text-zinc-600"
                  bind-inner-text="(task.role || 'Task') + ' · ' + (task.status || 'unknown')"
                ></p></article
            ></template>
            <p
              class="rounded-xl border border-dashed border-zinc-300 bg-white p-5 text-sm text-zinc-500"
              class-hidden="$ws.tasks.length > 0"
            >
              No tasks yet. Ask the Planner to break your goals into steps.
            </p>
          </div>
        </div>
      </main>
      <main data-chat-main hidden class="flex-1 min-w-0 h-[calc(100dvh-5rem)] md:h-dvh">
        <app-chat class="h-full block"></app-chat>
      </main>
      <nav aria-label="Primary navigation" class="h-20 shrink-0 border-t border-zinc-200 bg-white md:hidden">
        <div class="grid h-full grid-cols-5">
          <button
            class="flex flex-col items-center justify-center gap-1 text-xs"
            bind-class="{ 'text-emerald-700': $app.page === 'workspaces' || $app.page === 'overview', 'text-zinc-500': $app.page !== 'workspaces' && $app.page !== 'overview' }"
            bind-aria-current="$app.page === 'workspaces' ? 'page' : null"
            on-click="openWorkspaces()"
          >
            <span aria-hidden="true">▦</span><span>Workspaces</span>
          </button>
          <button
            class="flex flex-col items-center justify-center gap-1 text-xs"
            bind-class="{ 'text-emerald-700': $app.page === 'sessions', 'text-zinc-500': $app.page !== 'sessions' }"
            bind-aria-current="$app.page === 'sessions' ? 'page' : null"
            on-click="openSessions()"
          >
            <span aria-hidden="true">☰</span><span>Sessions</span>
          </button>
          <button
            class="flex flex-col items-center justify-center gap-1 text-xs"
            bind-class="{ 'text-emerald-700': $app.page === 'chat', 'text-zinc-500': $app.page !== 'chat' }"
            bind-aria-current="$app.page === 'chat' ? 'page' : null"
            on-click="openChatPage()"
          >
            <span aria-hidden="true">◌</span><span>Chat</span>
          </button>
          <button
            class="flex flex-col items-center justify-center gap-1 text-xs"
            bind-class="{ 'text-emerald-700': $app.page === 'tasks', 'text-zinc-500': $app.page !== 'tasks' }"
            bind-aria-current="$app.page === 'tasks' ? 'page' : null"
            on-click="openTasks()"
          >
            <span aria-hidden="true">✓</span><span>Tasks</span>
          </button>
          <button
            class="flex flex-col items-center justify-center gap-1 text-xs"
            bind-class="{ 'text-emerald-700': $app.page === 'integrations', 'text-zinc-500': $app.page !== 'integrations' }"
            bind-aria-current="$app.page === 'integrations' ? 'page' : null"
            on-click="openConnectors()"
          >
            <span aria-hidden="true">◇</span><span>Integrations</span>
          </button>
        </div>
      </nav>
    </template>
    <template if="!$p.profile"
      ><div class="m-auto">
        <button on-click="signIn(true)" class="rounded border border-zinc-700 p-3">Sign in</button>
      </div></template
    >
  </div>
  <script setup>
    import { effect, getElement, onInit } from "@li3/web";
    import { useWorkspaces } from "@app/store/workspaces.mjs";
    import { useSessions } from "@app/store/sessions.mjs";
    import { useProfile } from "@app/store/profile.mjs";
    import { signIn, signOut } from "@app/store/profile.mjs";
    import { useApp } from "@app/store/app.mjs";
    import { useMessages } from "@app/store/messages.mjs";
    import { Connectors, Sessions, Teams, Workspaces, events } from "@app/api.mjs";
    export default function () {
      const element = getElement();
      const $ws = useWorkspaces(),
        $s = useSessions(),
        $p = useProfile(),
        $app = useApp(),
        $msg = useMessages();
      let activeGoalId = "";
      let activeTask = null;
      let appReady = false;
      let displayedWorkspace = "";
      async function refreshTeam() {
        const team = await Teams.current();
        const summary = element.querySelector("[data-team-summary]");
        const members = element.querySelector("[data-team-members]");
        summary.textContent = team.id
          ? `${team.name} · ${team.role}`
          : "You are not in a team. Create a team to share integrations.";
        element.querySelector("[data-team-invite-button]").hidden = !["owner", "admin"].includes(team.role);
        members.replaceChildren(
          ...(team.members || []).map((member) => {
            const item = document.createElement("li");
            item.textContent = `${member.sub} · ${member.role}`;
            return item;
          }),
        );
      }
      async function createTeam() {
        try {
          await Teams.create(prompt("Team name") || "My team");
          await refreshTeam();
        } catch (error) {
          alert(error.message);
        }
      }
      async function addTeamMember() {
        try {
          const subject = prompt("Enter the invitee's OIDC subject");
          if (!subject?.trim()) {
            return;
          }
          await Teams.addMember(subject.trim());
          await refreshTeam();
        } catch (error) {
          alert(error.message);
        }
      }
      function renderWorkspaceSettings() {
        const description = $ws.settings.description || "";
        element.querySelector("[data-workspace-description]").value = description;
        element.querySelector("[data-description-text]").textContent = description;
        element.querySelector("[data-description-text]").hidden = !description;
        element.querySelector("[data-description-empty]").hidden = !!description;
        element.querySelector("[data-description-editor]").hidden = true;
        element.querySelector("[data-description-edit]").hidden = !description;
        const list = element.querySelector("[data-goals-list]");
        const goals = $ws.settings.goals || [];
        list.replaceChildren(
          ...goals.map((goal) => {
            const card = document.createElement("article");
            card.className = "flex items-center gap-3 rounded-xl border border-zinc-200 bg-white p-4";
            const open = document.createElement("button");
            open.className = "min-w-0 flex-1 text-left";
            const title = document.createElement("span");
            title.className = "block font-semibold";
            title.textContent = goal.title;
            const desc = document.createElement("span");
            desc.className = "mt-1 block truncate text-sm text-zinc-500";
            desc.textContent = goal.description || "No description";
            open.append(title, desc);
            open.addEventListener("click", () => {
              activeGoalId = goal.id;
              $app.openGoal(goal.id);
              renderGoal();
            });
            const edit = document.createElement("button");
            edit.className = "rounded border px-3 py-2 text-sm";
            edit.textContent = "Edit";
            edit.addEventListener("click", () => editGoal(goal));
            const remove = document.createElement("button");
            remove.className = "rounded px-2 py-2 text-sm text-red-700";
            remove.textContent = "Remove";
            remove.addEventListener("click", () => removeGoal(goal.id));
            card.append(open, edit, remove);
            return card;
          }),
        );
        element.querySelector("[data-goals-empty]").hidden = goals.length > 0;
      }
      async function renderWorkspaceHome() {
        if (!$ws.workspace) return;
        const sessions = [...(await Sessions.list($ws.workspace))].sort(
          (a, b) => Number(b.updatedAt || b.createdAt || 0) - Number(a.updatedAt || a.createdAt || 0),
        );
        const recent = element.querySelector("[data-recent-sessions]");
        recent.replaceChildren(
          ...sessions.map((session) => {
            const button = document.createElement("button");
            button.className = "block w-full rounded-lg border bg-white p-3 text-left";
            button.textContent = `${session.title || "Untitled conversation"} · ${new Date(Number(session.updatedAt || session.createdAt || 0)).toLocaleString()}`;
            button.addEventListener("click", () => openSession(session.id));
            return button;
          }),
        );
        element.querySelector("[data-recent-empty]").hidden = sessions.length > 0;
        const tasks = await Workspaces.tasks($ws.workspace);
        for (const status of ["todo", "in-progress", "done", "verified"]) {
          const target = element.querySelector(`[data-overview-main] [data-task-column="${status}"] > div`);
          target.replaceChildren(
            ...tasks
              .filter((task) => (task.status === "new" ? "todo" : task.status || "todo") === status)
              .map((task) => {
                const button = document.createElement("button");
                button.className = "w-full rounded-lg border bg-white p-3 text-left";
                button.textContent = `${task.title || task.task || "Task"}${task.execution?.phase ? ` · ${task.execution.phase}` : ""}`;
                button.draggable = true;
                button.dataset.taskId = task.id;
                button.addEventListener("dragstart", (event) => {
                  event.dataTransfer.setData("text/plain", task.id);
                  event.dataTransfer.effectAllowed = "move";
                });
                button.addEventListener("click", () => showTask(task));
                return button;
              }),
          );
          const column = element.querySelector(`[data-overview-main] [data-task-column="${status}"]`);
          column.ondragover = (event) => event.preventDefault();
          column.ondrop = (event) => {
            event.preventDefault();
            const id = event.dataTransfer.getData("text/plain");
            const task = tasks.find((item) => item.id === id);
            if (task && task.status !== status) {
              moveTask(task, status).catch((error) => alert(error.message));
            }
          };
        }
      }
      async function renderSessionList() {
        if (!$ws.workspace) return;
        const sessions = await Sessions.list($ws.workspace);
        const list = element.querySelector("[data-session-list]");
        list.replaceChildren(
          ...sessions.map((session) => {
            const button = document.createElement("button");
            button.className = "w-full rounded-xl border border-zinc-200 bg-white p-4 text-left shadow-sm";
            button.textContent = `${session.title || "Untitled conversation"} · Open conversation →`;
            button.addEventListener("click", () => openSession(session.id));
            return button;
          }),
        );
        element.querySelector("[data-session-empty]").hidden = sessions.length > 0;
      }
      async function renderGoal() {
        const goal = ($ws.settings.goals || []).find((item) => item.id === activeGoalId);
        if (!goal) {
          $app.openOverview();
          return;
        }
        element.querySelector("[data-goal-title]").textContent = goal.title;
        element.querySelector("[data-goal-description]").textContent = goal.description;
        const tasks = await Workspaces.tasks($ws.workspace, goal.id);
        for (const status of ["todo", "in-progress", "done", "verified"]) {
          const target = element.querySelector(`[data-goal-main] [data-task-column="${status}"] > div`);
          target.replaceChildren(
            ...tasks
              .filter(
                (task) =>
                  ((task.status === "new" || task.status === "queued" ? "todo" : task.status) || "todo") === status,
              )
              .map((task) => {
                const button = document.createElement("button");
                button.type = "button";
                button.className = "w-full rounded-lg border border-zinc-200 bg-white p-3 text-left shadow-sm";
                button.textContent = task.title || task.task;
                button.addEventListener("click", () => showTask(task));
                return button;
              }),
          );
        }
      }
      function editWorkspaceDescription() {
        const editor = element.querySelector("[data-description-editor]");
        editor.hidden = false;
        element.querySelector("[data-description-edit]").hidden = true;
        element.querySelector("[data-workspace-description]").focus();
      }
      function cancelWorkspaceDescription() {
        const description = $ws.settings.description || "";
        element.querySelector("[data-workspace-description]").value = description;
        element.querySelector("[data-description-text]").textContent = description;
        element.querySelector("[data-description-text]").hidden = !description;
        element.querySelector("[data-description-empty]").hidden = !!description;
        element.querySelector("[data-description-editor]").hidden = true;
        element.querySelector("[data-description-edit]").hidden = !description;
      }
      async function archiveWorkspace() {
        if (!confirm(`Archive ${$ws.workspace}?`)) return;
        try {
          await Workspaces.archive($ws.workspace);
          $ws.setWorkspace("");
          await $ws.reloadWorkspaceList();
          window.dispatchEvent(new Event("age:workspaces-changed"));
          $app.openSidebar();
        } catch (error) {
          alert(error.message);
        }
      }
      async function deleteWorkspace() {
        const name = $ws.workspace;
        if (!confirm(`Permanently delete ${name}? This cannot be undone.`)) return;
        try {
          await $ws.removeWorkspace();
          $app.openSidebar();
        } catch (error) {
          alert(error.message);
        }
      }
      async function saveWorkspaceDescription() {
        try {
          await $ws.saveSettings({ description: element.querySelector("[data-workspace-description]").value });
          renderWorkspaceSettings();
          cancelWorkspaceDescription();
        } catch (error) {
          alert(error.message);
        }
      }
      function editGoal(goal = null) {
        const form = element.querySelector("[data-goal-form]");
        form.dataset.id = goal?.id || "";
        form.elements.title.value = goal?.title || "";
        form.elements.description.value = goal?.description || "";
        element.querySelector("[data-goal-dialog-heading]").textContent = goal ? "Edit goal" : "Add goal";
        element.querySelector("[data-goal-dialog]").showModal();
        form.elements.title.focus();
      }
      async function saveGoal() {
        const form = element.querySelector("[data-goal-form]");
        if (!form.reportValidity()) return;
        const goals = [...($ws.settings.goals || [])];
        const goal = {
          id: form.dataset.id || crypto.randomUUID(),
          title: form.elements.title.value.trim(),
          description: form.elements.description.value,
        };
        const index = goals.findIndex((item) => item.id === goal.id);
        if (index < 0) goals.push(goal);
        else goals[index] = goal;
        try {
          await $ws.saveSettings({ goals });
          element.querySelector("[data-goal-dialog]").close();
          renderWorkspaceSettings();
          if (activeGoalId === goal.id) renderGoal();
        } catch (error) {
          if (error.message.includes("Goals changed elsewhere")) {
            await $ws.reloadWorkspaceData();
            renderWorkspaceSettings();
            await renderWorkspaceHome();
          }
          alert(error.message);
        }
      }
      async function removeGoal(id) {
        if (!confirm("Remove this goal?")) return;
        try {
          await $ws.saveSettings({ goals: $ws.settings.goals.filter((goal) => goal.id !== id) });
          renderWorkspaceSettings();
          if (activeGoalId === id) $app.openOverview();
        } catch (error) {
          if (error.message.includes("Goals changed elsewhere")) {
            await $ws.reloadWorkspaceData();
            renderWorkspaceSettings();
          }
          alert(error.message);
        }
      }
      function editCurrentGoal() {
        editGoal($ws.settings.goals.find((goal) => goal.id === activeGoalId));
      }
      async function createGoalTask() {
        const title = prompt("Task title");
        if (!title?.trim()) return;
        const description = prompt("Task description") || "";
        await Workspaces.createTask($ws.workspace, { title: title.trim(), description, goalId: activeGoalId });
        await renderGoal();
      }
      function renderComments(task) {
        element.querySelector("[data-task-comments]").replaceChildren(
          ...(task.comments || []).map((comment) => {
            const row = document.createElement("p");
            row.className = "rounded bg-zinc-100 p-2";
            const author =
              comment.author === "agent" ? "Agent" : comment.author === "overseer" ? "Overseer" : "Team member";
            row.textContent = `${author}: ${comment.content}`;
            return row;
          }),
        );
      }
      function showTask(task) {
        activeTask = task;
        element.querySelector("[data-task-title]").textContent = task.title || task.task;
        element.querySelector("[data-task-description]").textContent =
          task.description || task.context || "No description";
        const execution = task.execution || {};
        const statusSelect = element.querySelector("[data-task-status]");
        statusSelect.disabled = ["working", "reviewing"].includes(execution.phase);
        element.querySelector("[data-task-execution]").textContent = execution.percent
          ? `Overseer review: ${execution.percent}% · ${execution.summary || execution.phase || "Reviewing"}`
          : execution.phase
            ? `Agent activity: ${execution.phase}`
            : "";
        element.querySelector("[data-retry-review]").hidden = task.status !== "done" || execution.phase !== "error";
        statusSelect.value = ["new", "queued"].includes(task.status) ? "todo" : task.status || "todo";
        statusSelect.querySelector('option[value="verified"]').disabled = !["done", "verified"].includes(task.status);
        renderComments(task);
        element.querySelector("[data-task-dialog]").showModal();
      }
      async function moveTask(task, status) {
        let guidance;
        if (task.status === "done" && status === "in-progress") {
          guidance = prompt("What is missing from this task? Add guidance before reopening it.");
          if (!guidance?.trim()) {
            return;
          }
        }
        const updated = await Workspaces.updateTask($ws.workspace, task.id, status, guidance);
        if (activeTask?.id === task.id) {
          activeTask = updated;
          element.querySelector("[data-task-status]").value = updated.status;
          renderComments(updated);
        }
        await renderGoal();
        await renderWorkspaceHome();
      }
      async function changeTaskStatus(event) {
        if (!activeTask) return;
        const selector = event.currentTarget;
        const previousStatus = activeTask.status || "todo";
        try {
          const updated = await moveTask(activeTask, selector.value);
          if (!updated) selector.value = previousStatus;
        } catch (error) {
          selector.value = previousStatus;
          alert(error.message);
        }
      }
      async function retryTaskReview() {
        if (!activeTask) return;
        try {
          activeTask = await Workspaces.updateTask($ws.workspace, activeTask.id, "done");
          showTask(activeTask);
          await renderWorkspaceHome();
        } catch (error) {
          alert(error.message);
        }
      }
      async function addTaskComment(event) {
        event.preventDefault();
        if (!activeTask) return;
        const form = event.currentTarget;
        const result = await Workspaces.addTaskComment($ws.workspace, activeTask.id, form.elements.content.value);
        activeTask = result.task;
        form.reset();
        renderComments(activeTask);
      }
      function closeTaskDialog() {
        element.querySelector("[data-task-dialog]").close();
      }
      function syncPages() {
        const sidebar = element.querySelector("aside");
        if (!sidebar) {
          return;
        }
        const visibility = [
          [sidebar, $app.page !== "integrations"],
          [element.querySelector("[data-connectors-page]"), $app.page === "integrations"],
          [element.querySelector("[data-overview-main]"), $app.page === "overview" || $app.page === "workspaces"],
          [element.querySelector("[data-settings-main]"), $app.page === "settings"],
          [element.querySelector("[data-goal-main]"), $app.page === "goal"],
          [element.querySelector("[data-sessions-main]"), $app.page === "sessions"],
          [element.querySelector("[data-tasks-main]"), $app.page === "tasks"],
          [element.querySelector("[data-chat-main]"), $app.page === "chat"],
        ];
        for (const [node, visible] of visibility) {
          node.hidden = !visible;
          node.style.display = visible ? "" : "none";
        }
        element.querySelector("[data-empty-workspace]").hidden = !!$ws.workspace;
        element.querySelector("[data-overview-content]").hidden = !$ws.workspace;
      }
      effect(
        () => `${$app.page}:${$app.isCompact}:${$app.goalId}:${$ws.workspace}`,
        async () => {
          syncPages();
          if (appReady && displayedWorkspace !== $ws.workspace) {
            displayedWorkspace = $ws.workspace;
            await $ws.reloadWorkspaceData();
            renderWorkspaceSettings();
          }
          if (appReady && $app.page === "goal") {
            activeGoalId = $app.goalId;
            await renderGoal();
          }
          if (appReady && ($app.page === "overview" || $app.page === "workspaces")) await renderWorkspaceHome();
          if (appReady && $app.page === "sessions") await renderSessionList();
        },
      );
      onInit(async () => {
        await $p.reloadProfile();
        if ($p.profile) {
          await $ws.reloadWorkspaceList();
          if ($ws.workspace) {
            await $ws.reloadWorkspaceData();
          }
          if (!$ws.workspace) $app.openSidebar();
        }
        syncPages();
        activeGoalId = $app.goalId;
        renderWorkspaceSettings();
        await renderWorkspaceHome();
        if ($app.page === "goal") {
          await renderGoal();
        }
        element.querySelector("[data-task-status]").addEventListener("change", changeTaskStatus);
        element.querySelector("[data-comment-form]").addEventListener("submit", addTaskComment);
        if ($p.profile) refreshTeam().catch(console.error);
        displayedWorkspace = $ws.workspace;
        appReady = true;
        events.addEventListener("message", () => {
          if ($app.page === "overview" && $ws.workspace) renderWorkspaceHome().catch(console.error);
        });
        events.addEventListener("agent-status", () => {
          if ($app.page === "overview" && $ws.workspace) renderWorkspaceHome().catch(console.error);
        });
        events.addEventListener("task-status", (event) => {
          if ($app.page === "overview" && event.detail?.workspace === $ws.workspace) {
            renderWorkspaceHome().catch(console.error);
          }
        });
      });
      async function onCreateWorkspace() {
        const name = prompt("Workspace name");
        if (!name?.trim()) return;
        try {
          await $ws.createWorkspace(name.trim());
          $app.openOverview();
        } catch (error) {
          alert(`Could not create the workspace: ${error instanceof Error ? error.message : "Unknown error"}`);
        }
      }

      function openWorkspaces() {
        $app.openSidebar();
      }

      function selectWorkspace(name) {
        $app.openWorkspace(name);
      }

      function openOverview() {
        $app.openOverview();
      }

      function openSessions() {
        $app.openSessions();
      }

      function openTasks() {
        $app.openTasks();
      }

      function openIntegrations() {
        openConnectors();
      }

      function openChatPage() {
        $app.openChat();
      }

      async function createSession() {
        await $s.createSession();
        $app.openChat();
      }

      async function createPlannerSession() {
        await $ws.reloadWorkspaceData();
        await $s.createSession({ role: "planner", title: "Planner" });
        $app.openChat();
        await $msg.reloadMessages();
        const goals = ($ws.settings.goals || []).map(
          (goal) => `- ${goal.title}: ${goal.description || "No description"}`,
        );
        const prompt = [
          `Review the current state of the ${$ws.workspace} workspace and help me plan its goal work.`,
          `Workspace brief: ${$ws.settings.description?.trim() || "No brief provided."}`,
          `Goals:\n${goals.length ? goals.join("\n") : "No goals have been added yet."}`,
          "Break concrete goal work into independently completable tasks. Use DelegateTask for each actionable task, include testable acceptance criteria in its context, and link it to a goalId when applicable. Avoid duplicate tasks and prioritize the work. Then summarize the task plan and blockers; do not claim work has already been done.",
        ].join("\n\n");
        $msg.setNewMessage(prompt);
        await $msg.sendMessage();
      }

      async function openSession(id) {
        await $s.setSessionById(id);
        $app.openChat();
      }

      async function onDeleteSession(id) {
        if (confirm("Delete this session?")) {
          await $s.deleteSessionById(id);
        }
      }
      async function openConnectors() {
        $app.openIntegrations();
        const page = element.querySelector("[data-connectors-page]");
        page.querySelector("[data-page-status]").textContent = "";
        try {
          const connectors = await Connectors.list();
          const chatgpt = connectors.find((connector) => connector.provider === "chatgpt");
          page.querySelector("[data-chatgpt-status]").textContent = chatgpt?.configured
            ? `Connected${chatgpt.model ? ` · default model: ${chatgpt.model}` : ""}`
            : "Not connected";
          page.querySelector("[data-chatgpt-disconnect]").hidden = !chatgpt?.configured;
          for (const connector of connectors) {
            if (connector.provider === "ollama" || connector.provider === "chatgpt") {
              continue;
            }
            const form = page.querySelector(`[data-provider-form="${connector.provider}"]`);
            const status = form.querySelector(`[data-provider-status="${connector.provider}"]`);
            status.textContent = connector.configured
              ? `Configured${connector.model ? ` · default model: ${connector.model}` : ""}`
              : "Not connected";
            form.elements.model.value = connector.model;
          }
          renderOllamaServers(connectors.filter((connector) => connector.provider === "ollama"));
        } catch (error) {
          page.querySelector("[data-page-status]").textContent = error.message;
        }
      }
      async function saveConnector(event) {
        const form = event.currentTarget;
        const values = Object.fromEntries(new FormData(form));
        const provider = form.dataset.providerForm;
        values.provider = provider;
        if (provider === "ollama" && form.dataset.connectorId) {
          values.id = form.dataset.connectorId;
        }
        const status = form.querySelector(`[data-provider-status="${provider}"]`);
        status.textContent = "Saving…";
        try {
          const connector = await Connectors.save(values);
          status.textContent = `${connector.provider} settings saved. Test the connection to load available models.`;
          if (connector.provider === "ollama") {
            form.dataset.connectorId = connector.id;
            form.querySelector("[data-connector-name]").textContent = connector.name;
          }
          if (form.elements.credential) {
            form.elements.credential.value = "";
          }
          await $msg.reloadModelList();
        } catch (error) {
          status.textContent = error.message;
        }
      }
      async function testConnector(provider, form = element.querySelector(`[data-provider-form="${provider}"]`)) {
        const status = form.querySelector(`[data-provider-status="${provider}"]`);
        if (provider === "ollama" && !form.dataset.connectorId) {
          status.textContent = "Save this server before testing its connection.";
          return;
        }
        status.textContent = "Testing connection…";
        try {
          const models = await Connectors.test(provider, form.dataset.connectorId);
          status.textContent = `Connected · ${models.length} model${models.length === 1 ? "" : "s"} available`;
          if (!form.elements.model.value && models.length) {
            form.elements.model.value = models[0].name;
          }
        } catch (error) {
          status.textContent = error.message;
        }
      }
      async function removeConnector(provider, form = element.querySelector(`[data-provider-form="${provider}"]`)) {
        if (!confirm(`Disconnect ${provider}?`)) {
          return;
        }
        if (provider === "chatgpt") {
          const status = element.querySelector("[data-chatgpt-status]");
          try {
            await Connectors.remove(provider);
            status.textContent = "Disconnected";
            element.querySelector("[data-chatgpt-disconnect]").hidden = true;
            await $msg.reloadModelList();
          } catch (error) {
            status.textContent = error.message;
          }
          return;
        }
        const status = form.querySelector(`[data-provider-status="${provider}"]`);
        try {
          await Connectors.remove(provider, form.dataset.connectorId);
          if (provider === "ollama") {
            const connectors = await Connectors.list();
            renderOllamaServers(connectors.filter((connector) => connector.provider === "ollama"));
          } else {
            form.reset();
            status.textContent = "Disconnected";
          }
          await $msg.reloadModelList();
        } catch (error) {
          status.textContent = error.message;
        }
      }
      async function connectChatgpt() {
        const status = element.querySelector("[data-chatgpt-status]");
        const link = element.querySelector("[data-chatgpt-link]");
        const button = element.querySelector("[data-chatgpt-connect]");
        button.disabled = true;
        link.hidden = true;
        try {
          const login = await Connectors.startChatgptLogin();
          link.href = login.verificationUrl;
          link.textContent = `Open ${login.verificationUrl} and enter code: ${login.userCode}`;
          link.hidden = false;
          status.textContent = "Open the verification link, enter the code, and approve access in OpenAI.";
          while (true) {
            await new Promise((resolve) => window.setTimeout(resolve, login.interval * 1000));
            const result = await Connectors.pollChatgptLogin(login.loginId);
            if (!result.pending) {
              link.hidden = true;
              status.textContent = "Connected to ChatGPT. Choose a ChatGPT model in Chat.";
              element.querySelector("[data-chatgpt-disconnect]").hidden = false;
              await $msg.reloadModelList();
              return;
            }
          }
        } catch (error) {
          status.textContent = error.message;
          button.disabled = false;
        }
      }
      function createOllamaForm(connector = {}) {
        const form = document.createElement("form");
        form.dataset.providerForm = "ollama";
        if (connector.id) {
          form.dataset.connectorId = connector.id;
        }
        form.className = "space-y-4 rounded-xl border border-zinc-800 bg-zinc-950 p-4";

        const heading = document.createElement("h3");
        heading.className = "font-medium";
        heading.dataset.connectorName = "";
        heading.textContent = connector.name || "New Ollama server";
        form.append(heading);

        const status = document.createElement("p");
        status.className = "text-xs text-zinc-400";
        status.dataset.providerStatus = "ollama";
        status.setAttribute("role", "status");
        status.textContent = connector.id ? "Configured" : "Not saved";
        form.append(status);

        const addInput = (labelText, name, type, value, placeholder, required = false) => {
          const label = document.createElement("label");
          label.className = "block text-sm";
          label.append(document.createTextNode(labelText));
          const input = document.createElement("input");
          input.name = name;
          input.type = type;
          input.value = value || "";
          input.placeholder = placeholder;
          input.required = required;
          input.className = "mt-1 w-full rounded bg-zinc-800 p-2";
          label.append(input);
          form.append(label);
        };
        addInput("Server name", "name", "text", connector.name, "Home Ollama", true);
        addInput("Server URL", "url", "url", connector.url, "https://ollama.example.com", true);
        addInput("Default model", "model", "text", connector.model, "llama3.2");

        const actions = document.createElement("div");
        actions.className = "flex flex-wrap gap-2";
        const addButton = (label, className, handler, submit = false) => {
          const button = document.createElement("button");
          button.type = submit ? "submit" : "button";
          button.className = className;
          button.textContent = label;
          if (handler) {
            button.addEventListener("click", handler);
          }
          actions.append(button);
        };
        addButton("Save server", "rounded bg-emerald-700 px-3 py-2 text-sm", null, true);
        addButton("Test connection", "rounded border border-zinc-700 px-3 py-2 text-sm", () =>
          testConnector("ollama", form),
        );
        if (connector.id) {
          addButton("Disconnect", "rounded px-3 py-2 text-sm text-red-300", () => removeConnector("ollama", form));
        }
        form.append(actions);
        form.addEventListener("submit", (event) => {
          event.preventDefault();
          saveConnector(event);
        });
        return form;
      }
      function renderOllamaServers(connectors) {
        const list = element.querySelector("[data-ollama-servers]");
        list.replaceChildren(...(connectors.length ? connectors.map(createOllamaForm) : [createOllamaForm()]));
      }
      function addOllamaServer() {
        element.querySelector("[data-ollama-servers]").append(createOllamaForm());
      }
      return {
        createTeam,
        addTeamMember,
        $ws,
        $s,
        $p,
        $app,
        signIn,
        signOut,
        onCreateWorkspace,
        saveWorkspaceDescription,
        editGoal,
        saveGoal,
        editCurrentGoal,
        createGoalTask,
        closeTaskDialog,
        retryTaskReview,
        createSession,
        createPlannerSession,
        editWorkspaceDescription,
        cancelWorkspaceDescription,
        archiveWorkspace,
        deleteWorkspace,
        openSession,
        onDeleteSession,
        openConnectors,
        openWorkspaces,
        selectWorkspace,
        openOverview,
        openWorkspaceSettings: () => $app.openWorkspaceSettings(),
        openSessions,
        openTasks,
        openIntegrations,
        openChatPage,
        saveConnector,
        testConnector,
        removeConnector,
        connectChatgpt,
        addOllamaServer,
      };
    }
  </script>
</template>
