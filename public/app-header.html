<template component="app-header">
  <header class="border-b border-zinc-800 bg-zinc-900/50 px-4 flex items-center justify-between">
    <template if="$.profile">
      <div class="flex items-center flex-wrap md:flex-nowrap md:space-x-2">
        <button class="flex items-center space-x-2 flex-1" on-click="window.location.reload()">
          <span class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></span>
          <span class="font-semibold text-sm tracking-wide uppercase text-zinc-300 hidden md:block">Workspaces</span>
        </button>

        <dynamic-list
          label="Workspace"
          class="w-full md:w-1/2"
          placeholder="Select"
          bind-list="wsList"
          bind-selected="$ws.workspace"
          on-reload="$ws.reloadWorkspaceList()"
          on-add="onCreateWorkspace()"
          on-select="$ws.setWorkspace($event.detail)"
          on-remove="onRemoveWorkspace()"
          bind-actions="[{ icon: 'trash-2', action: 'remove', label: 'Remove', color: 'text-red-400' }]"
        ></dynamic-list>

        <dynamic-list
          label="Session"
          class="w-full md:w-1/2"
          placeholder="Switch sessions"
          on-add="$s.createSession()"
          on-reload="$s.reloadSessionList()"
          on-select="$s.setSessionById($event.detail)"
          on-remove="onDeleteSession()"
          bind-selected="$s.sessionId"
          bind-list="sessionList"
          bind-actions="[{ icon: 'trash-2', action: 'remove', label: 'Remove', color: 'text-red-400' }]"
        ></dynamic-list>
      </div>
    </template>

    <template if="!$p.profile">
      <div class="flex items-center space-x-3">
        <button
          on-click="signIn(true)"
          class="text-emerald-600 hover:text-emerald-500 border border-zinc-950 p-2 rounded-full transition"
        >
          <lucide-icon icon="user"></lucide-icon>
        </button>
      </div>
    </template>
  </header>

  <script setup src="./app-header.mjs"></script>
</template>
